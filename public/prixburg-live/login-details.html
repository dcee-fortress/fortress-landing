<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prixburg - Login details</title>
    <link rel="stylesheet" href="app.css?v=13">
    <script src="supabase-config.js"></script>
    <script src="db.js?v=7"></script>
    <script src="permitted_users.js"></script>
    <script src="protect_user.js"></script>
    <script src="gates.js"></script>
    <script>requireSettingsAccess();</script>
</head>
<body>
    <main class="main">
        <div class="topbar">
            <div>
                <div class="menu-wrap">
                    <button type="button" class="dropdown-btn" onclick="toggleDropdown(event)" title="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg></button>
                    <div id="dropdownMenu" class="dropdown-content"></div>
                </div>
                <h2><a href="settings.html" class="page-back">Settings</a></h2>
            </div>
            <div class="topbar-actions" id="topbarActions"></div>
        </div>

        <form id="loginDetailsForm" class="credentials-form">
            <div class="panel">
                <h3>Main home page credentials</h3>
                <p>Username and password for the main opening login page.</p>
                <div class="form-group">
                    <label for="mainUsername">Username</label>
                    <input type="text" id="mainUsername" name="mainUsername" autocomplete="off" required>
                </div>
                <div class="form-group">
                    <label for="mainPassword">Password</label>
                    <input type="text" id="mainPassword" name="mainPassword" autocomplete="off" required>
                </div>
            </div>

            <div class="panel">
                <h3>Settings credentials</h3>
                <p>Username and password for settings and detergent files.</p>
                <div class="form-group">
                    <label for="settingsUsername">Username</label>
                    <input type="text" id="settingsUsername" name="settingsUsername" autocomplete="off" required>
                </div>
                <div class="form-group">
                    <label for="settingsPassword">Password</label>
                    <input type="text" id="settingsPassword" name="settingsPassword" autocomplete="off" required>
                </div>
                <div class="credentials-save-row">
                    <button type="submit" class="primary-btn">Save</button>
                    <span id="loginDetailsStatus"></span>
                </div>
            </div>
        </form>
    </main>
    <script src="nav.js?v=7"></script>
    <script src="login-details.js"></script>
</body>
</html>
