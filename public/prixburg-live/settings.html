<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prixburg - Settings</title>
    <link rel="stylesheet" href="app.css?v=10">
    <script src="supabase-config.js"></script>
    <script src="db.js?v=5"></script>
    <script src="permitted_users.js"></script>
    <script src="protect_user.js"></script>
    <script src="gates.js"></script>
    <script>requireSettingsAccess();</script>
</head>
<body>
    <main class="main">
        <div class="topbar">
            <div>
                <div class="menu-wrap">
                    <button type="button" class="dropdown-btn" onclick="toggleDropdown(event)" title="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg></button>
                    <div id="dropdownMenu" class="dropdown-content"></div>
                </div>
                <h2>Settings</h2>
            </div>
            <div class="topbar-actions" id="topbarActions"></div>
        </div>

        <div class="panel">
            <h3>Account</h3>
            <ul class="settings-list">
                <li>Signed in as <strong id="settingsUser">-</strong></li>
            </ul>
            <a class="choice-btn" href="login-details.html" style="margin-top: 10px;">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="8" cy="15" r="4"/>
                    <path d="M10.8 13.2L21 3"/>
                    <path d="M16 8h4"/>
                    <path d="M18 6v4"/>
                </svg>
                Login details
            </a>
            <form id="ceoNameForm" class="credentials-form" style="margin-top: 16px;">
                <div class="form-group">
                    <label for="ceoName">CEO name</label>
                    <input type="text" id="ceoName" name="ceoName" autocomplete="name" placeholder="CEO name">
                </div>
                <div class="credentials-save-row">
                    <button type="submit" class="primary-btn">Save</button>
                    <span id="ceoNameStatus"></span>
                </div>
            </form>
        </div>

        <div class="panel">
            <h3>Formulas</h3>
            <a class="choice-btn" href="access-login.html?next=formulas">
                <svg class="formula-flask" viewBox="0 0 24 24" aria-hidden="true">
                    <path class="flask-liquid" d="M7.82 14L5.2 18.2A2 2 0 0 0 6.9 21h10.2a2 2 0 0 0 1.7-2.8L16.18 14Z"/>
                    <path d="M9 3h6"/>
                    <path d="M10 3v7.5L5.2 18.2A2 2 0 0 0 6.9 21h10.2a2 2 0 0 0 1.7-2.8L14 10.5V3"/>
                    <path d="M8.5 14h7"/>
                </svg>
                Detergent formulars
            </a>
            <a class="choice-btn" href="pricing.html" style="margin-top: 10px;">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Pricing files
            </a>
        </div>

        <div class="panel">
            <h3>Daily files</h3>
            <p class="file-meta" id="autoDailyStatus">Daily sales files are created automatically every day.</p>
            <button type="button" class="choice-btn" id="autoDailyToggleBtn" onclick="toggleAutoDailyFiles()" style="margin-top: 10px; width: 100%;">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="16" rx="2"/>
                    <path d="M3 10h18"/>
                    <path d="M8 3v4"/>
                    <path d="M16 3v4"/>
                </svg>
                <span id="autoDailyToggleLabel">Stop automatic daily files</span>
            </button>
        </div>

        <div class="panel">
            <h3>Recycle bin</h3>
            <a class="choice-btn" href="recycle-bin.html">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
                Recycle bin
            </a>
            <p class="file-meta" style="margin-top: 10px;">Deleted files stay here for 90 days. Restore them, or delete them permanently.</p>
        </div>
    </main>
    <script src="nav.js?v=6"></script>
    <script>
        document.getElementById('settingsUser').textContent = sessionStorage.getItem('currentUser') || 'Unknown';

        const ceoNameForm = document.getElementById('ceoNameForm');
        const ceoNameInput = document.getElementById('ceoName');
        const ceoNameStatus = document.getElementById('ceoNameStatus');

        function paintCeoName() {
            if (!ceoNameInput || typeof getLoginDetails !== 'function') return;
            if (document.activeElement === ceoNameInput) return;
            ceoNameInput.value = getLoginDetails().ceoName || '';
        }

        if (ceoNameForm) {
            ceoNameForm.addEventListener('submit', function (event) {
                event.preventDefault();
                if (typeof getLoginDetails !== 'function' || typeof saveLoginDetails !== 'function') return;
                const details = getLoginDetails();
                details.ceoName = ceoNameInput.value.trim();
                saveLoginDetails(details);
                if (ceoNameStatus) ceoNameStatus.textContent = 'Saved.';
            });
            ceoNameInput.addEventListener('input', function () {
                if (ceoNameStatus) ceoNameStatus.textContent = '';
            });
        }

        function paintAutoDailyFiles() {
            const on = typeof autoDailyFilesOn === 'function' ? autoDailyFilesOn() : true;
            const status = document.getElementById('autoDailyStatus');
            const label = document.getElementById('autoDailyToggleLabel');
            if (label) label.textContent = on ? 'Stop automatic daily files' : 'Start automatic daily files';
            if (status) {
                status.textContent = on
                    ? 'Daily sales files are created automatically every day.'
                    : 'Automatic daily files are off. Add a sale in Daily, Weekly, Monthly, or Yearly sales entry and a daily file is created. Sales analysis still rolls up those files the same way.';
            }
        }

        function toggleAutoDailyFiles() {
            const on = typeof autoDailyFilesOn === 'function' ? autoDailyFilesOn() : true;
            saveAppSettings({ autoDailyFiles: !on });
            paintAutoDailyFiles();
        }

        if (typeof whenDbReady === 'function') whenDbReady(function () {
            paintAutoDailyFiles();
            paintCeoName();
        });
        else {
            paintAutoDailyFiles();
            paintCeoName();
        }
    </script>
</body>
</html>
